[project]
name = "indra-engine"
version = "0.1.0"
description = "Indra analysis engine — local audio analysis backend"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "fastapi~=0.139.0",
    "uvicorn[standard]~=0.50.0",
    "sse-starlette~=3.4",
    "pydantic~=2.9",
    "numpy<2.2",
    "scipy>=1.13",
    "librosa~=0.11.0",
    "soundfile>=0.13,<0.15",
    "av>=12,<14.3",  # 14.4.0 has no cp312 wheels; source build needs ffmpeg 7 headers
    "pyarrow>=23,<25",
    "zarr>=3.1.6,<4",
    "numcodecs>=0.15",
    "blake3>=1.0",
    "xxhash>=3.4",
    "libfmp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-licenses>=5",
    "psutil>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indra"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/indra/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/indra"]
exclude = ["src/indra/_vendor"]

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "soundfile.*",
    "libfmp.*",
    "scipy.*",
    "zarr.*",
    "numcodecs.*",
    "av.*",
    "indra._vendor.*",
]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "libfmp.*", "scipy.*", "zarr.*", "numcodecs.*", "av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["indra"]
omit = ["*/_vendor/*", "*/server.py"]

[tool.ruff.lint.per-file-ignores]
"src/indra/_vendor/**" = ["ALL"]
